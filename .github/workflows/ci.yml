name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Якість коду
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Перевірити стиль коду
        run: ruff check .

      - name: Перевірити форматування
        run: ruff format --check .

  test:
    name: Тести
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Виконати тести з покриттям
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Завантажити звіт про покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Інтеграція
    runs-on: ubuntu-latest
    needs:
      - quality
      - test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://crm:crm@127.0.0.1:5432/crm
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Запустити API на PostgreSQL
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Дочекатися готовності API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "API не запустився за відведений час"
          cat uvicorn.log
          exit 1

      - name: Налаштувати Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Встановити Newman
        run: npm install --global newman

      - name: Виконати інтеграційні тести API
        run: |
          newman run postman/CRM-System.postman_collection.json \
            --environment postman/CRM-System.postman_environment.json \
            --iteration-count 3 \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Показати журнал API
        if: always()
        run: cat uvicorn.log

      - name: Завантажити звіт Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          if-no-files-found: ignore

  build:
    name: Збірка
    runs-on: ubuntu-latest
    needs:
      - quality
      - test
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Зібрати Docker-образ
        run: |
          docker build --tag crm-system:${{ github.sha }} .
          docker image inspect crm-system:${{ github.sha }} \
            --format 'Розмір образу: {{.Size}} байт'

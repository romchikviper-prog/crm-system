[project]
name = "crm-system"
version = "0.1.0"
description = "CRM-система для автоматизації роботи з клієнтами та контролю замовлень"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

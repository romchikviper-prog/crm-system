services:
  db:
    image: postgres:16-alpine
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: crm-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  crm_pgdata:
